name: Build Origin Rewrite Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'Info.json'
      - 'Manifest.json'
      - 'OriginRewrite.json'
      - 'src/**'
      - 'include/**'
      - 'third_party/mod-api/**'
      - 'scripts/package_android_arm64.sh'
      - '.github/workflows/android-arm64.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android NDK
        shell: bash
        run: |
          NDK_DIR=$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -n "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      - name: Build and assemble installable package
        shell: bash
        run: bash scripts/package_android_arm64.sh

      - name: Check ARM64 ELF
        shell: bash
        run: |
          LIB=$(find build-android-arm64 -type f -name 'libOriginRewrite.android.arm64.so' -print -quit)
          test -n "$LIB"
          file "$LIB" | grep -E 'ARM aarch64|AArch64'

      - name: Upload installable mod package
        uses: actions/upload-artifact@v4
        with:
          name: OriginRewrite-android-arm64-installable
          path: OriginRewrite-android-arm64.zip
