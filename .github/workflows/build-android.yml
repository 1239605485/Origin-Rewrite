name: Build OriginRewrite Android ARM64

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_NDK_VERSION: 26.3.11579264
      ORIGINREWRITE_VERSION: 1.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-24" \
            "build-tools;35.0.0" "cmake;3.22.1" "ndk;${ANDROID_NDK_VERSION}"

      - name: Validate JSON and host syntax
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc jq
          find . -type f -name '*.json' -print0 | xargs -0 -n1 jq empty
          find src -type f -name '*.c' -print0 | while IFS= read -r -d '' file; do
            gcc -std=c11 -fsyntax-only -Iinclude -Imod-api -Ixdl/include -Ixdl "$file"
          done

      - name: Build and package Android ARM64
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk"
          export ANDROID_NDK_HOME="$android_sdk/ndk/$ANDROID_NDK_VERSION"
          bash scripts/package_android_arm64.sh

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: OriginRewrite-${{ env.ORIGINREWRITE_VERSION }}
          path: dist/OriginRewrite-v${{ env.ORIGINREWRITE_VERSION }}.zip
          if-no-files-found: error
