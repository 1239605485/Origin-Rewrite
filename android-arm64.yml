name: Android ARM64 package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  core-tests:
    name: Pure core tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure host tests
        run: cmake -S . -B build-host -G Ninja -DORIGINREWRITE_BUILD_TESTS=ON
      - name: Build host tests
        run: cmake --build build-host --parallel 2
      - name: Run host tests
        run: ctest --test-dir build-host --output-on-failure

  android-arm64:
    name: Build installable ARM64 package
    runs-on: ubuntu-22.04
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342"
      - name: Build and package
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.2.11394342"
          export ORIGINREWRITE_OUTPUT="$GITHUB_WORKSPACE/OriginRewrite-v0.9.7-tefmanager-feature-enums-android-arm64.zip"
          bash scripts/package_android_arm64.sh
      - name: Generate checksum
        run: sha256sum OriginRewrite-v0.9.7-tefmanager-feature-enums-android-arm64.zip > OriginRewrite-v0.9.7-tefmanager-feature-enums-android-arm64.zip.sha256
      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: OriginRewrite-v0.9.7-tefmanager-feature-enums-android-arm64
          path: |
            OriginRewrite-v0.9.7-tefmanager-feature-enums-android-arm64.zip
            OriginRewrite-v0.9.7-tefmanager-feature-enums-android-arm64.zip.sha256
          if-no-files-found: error
